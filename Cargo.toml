[package]
name = "otlp-proto"
version = "0.10.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
prost-build = "0.14"

# Optimize for minimal size in release builds
[profile.release]
lto = true
panic = "abort"
opt-level = "z"
strip = "symbols"
codegen-units = 1
